spring.application.name=demo

# Connection to MySQL DB
spring.datasource.url=jdbc:mysql://localhost:3306/sa63?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=password1$
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Session is connecting the java program to db
# false connection to the DB pool conserved
spring.jpa.open-in-view=false
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Load data.sql into MySQL after Hibernate has created the tables
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Show the exception message on the error page (e.g. "Employee x not found")
server.error.include-message=always